name: Manual Workflow

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string

      environment:
        default: dev
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Print inputs summary
        run: |
          echo "Version: ${{ inputs.version }}"
          echo "Environment: ${{ inputs.environment }}"
