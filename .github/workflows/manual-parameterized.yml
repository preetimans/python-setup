name: Parameterized Manual Workflow

on:
  workflow_dispatch:
    inputs:
      application_name:
        type: string
        required: true
      run_validation:
        type: boolean
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      validation_status: ${{ steps.determine_status.outputs.validation_status }}
    steps:
      - name: Print environment details
        run: echo "Application name is ${{ inputs.application_name }} with run_validation as ${{ inputs.run_validation }}"
    
      - name: Determine validation result
        id: determine_status
        run: |
          RUN_VAL="${{ inputs.run_validation }}"
          
          if [ "$RUN_VAL" = "true" ]; then
            echo "validation_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "validation_status=skipped" >> "$GITHUB_OUTPUT"
          fi

  summary:
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.validation_status == 'success'
    steps:
      - name: Execution summary
        run: echo "Jobs executed successfully"

